<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAPAK – Layanan Pinjam Aset dan Kebutuhan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  color-scheme: light;
  --bg:#f7f5fc; --surface:#ffffff; --surface-2:#faf8fe; --line:#ece7f6; --line-2:#ddd5ee;
  --ink:#2a2640; --ink-2:#56526d; --muted:#857f9c;
  --brand:#5d4fc2; --brand-2:#7466d6; --brand-soft:#f0edfe;
  --fill:#c7bdf6; --fill-2:#b8acf2; --on-fill:#251f4d;
  --gold:#b0532f; --gold-soft:#fff0e8; --peach:#ffc7ad; --peach-2:#ffb895; --on-peach:#4a2312;
  --mint:#bfead8; --sky:#c9e4fb; --pink:#fbd3e4;
  --series:#8a7ee6;
  --good:#23795a; --good-bg:#e2f6ed; --warn:#8f5b00; --warn-bg:#fff3d6;
  --serious:#ad4413; --serious-bg:#ffe8dc; --crit:#b3263a; --crit-bg:#ffe6ea;
  --info:#2f62b3; --info-bg:#e5f0fe; --neutral:#56526d; --neutral-bg:#f0eef6;
  --radius:16px; --shadow:0 1px 2px rgba(42,38,64,.04),0 8px 24px rgba(93,79,194,.07);
  --page-grad:linear-gradient(180deg,#efeafe 0,#fbf3f7 380px,#f7f5fc 760px);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#16141f; --surface:#1f1c2b; --surface-2:#252233; --line:#322e44; --line-2:#3e3953;
    --ink:#f1eefb; --ink-2:#c3bdd8; --muted:#958fae;
    --brand:#bcb2fb; --brand-2:#a99ef5; --brand-soft:#2c2745;
    --fill:#a99ef5; --fill-2:#bcb2fb; --on-fill:#1b1636;
    --gold:#ffbf9f; --gold-soft:#3a2a24; --peach:#f6ae8c; --peach-2:#ffc2a4; --on-peach:#3a1a0b;
    --series:#a99ef5;
    --good:#7fdcb6; --good-bg:#1d3329; --warn:#f3c364; --warn-bg:#362b12;
    --serious:#f7a079; --serious-bg:#3c251b; --crit:#f58a9a; --crit-bg:#3d1d24;
    --info:#9cc2f6; --info-bg:#1c2b44; --neutral:#c3bdd8; --neutral-bg:#2a2739;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --page-grad:linear-gradient(180deg,#221d36 0,#1d1823 380px,#16141f 760px);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-image:var(--page-grad);background-repeat:no-repeat;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-2)}

/* Topbar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.logo{width:46px;height:46px;border-radius:50%;flex:none;display:block;object-fit:contain;box-shadow:0 2px 8px rgba(42,38,64,.12)}
.brand-name{font-weight:800;font-size:18px;letter-spacing:.08em;color:var(--brand)}
.brand-sub{font-size:12.5px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.clock{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.admin-pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--gold-soft);color:var(--gold)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:9px 16px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.btn.primary:hover{background:var(--fill-2);border-color:var(--fill-2)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.outline{background:transparent}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:8px}
.btn.lg{padding:13px 22px;font-size:16px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.icon-btn{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:8px}
.icon-btn:hover{background:var(--surface-2)}
.link{background:none;border:0;padding:0;color:var(--brand-2);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Layout */
.layout{display:flex;min-height:calc(100vh - 67px)}
.side{width:240px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:67px;height:calc(100vh - 67px);overflow:auto}
.side h5{margin:16px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.side h5:first-child{margin-top:0}
.nav-btn{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:9px;border:0;background:transparent;cursor:pointer;text-align:left;font-weight:500;color:var(--ink-2)}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.nav-count{font-size:11.5px;font-weight:700;min-width:22px;text-align:center;padding:1px 7px;border-radius:99px;background:var(--warn-bg);color:var(--warn)}
main{flex:1;min-width:0;padding:28px 32px 120px}
.wrap{max-width:1180px;margin:0 auto}
#banner:empty{display:none}
.banner{padding:12px 24px;font-size:14px;font-weight:500;border-bottom:1px solid var(--line)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.err{background:var(--crit-bg);color:var(--crit)}

/* Home */
.hero{margin:8px 0 26px}
.hero h1{font-size:30px;font-weight:800}
.hero .lead{margin:8px 0 0;color:var(--ink-2);max-width:640px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--brand),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.modules{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.module{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:20px;position:relative;overflow:hidden}
.module::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--fill),var(--sky))}
.module.m-minta::before{background:linear-gradient(90deg,var(--peach),var(--pink))}
.module-head{display:flex;gap:16px;align-items:flex-start}
.module-ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.m-minta .module-ico{background:var(--gold-soft);color:var(--gold)}
.m-minta .eyebrow{color:var(--gold)}
.module-head h2{font-size:22px;font-weight:800}
.module-head p:not(.eyebrow){margin:6px 0 0;color:var(--ink-2)}
.module-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:18px 18px;border-radius:14px;border:1px solid var(--fill);background:var(--fill);color:var(--on-fill);cursor:pointer;text-align:left;transition:transform .06s,background .15s}
.big-btn strong{font-size:17px}
.big-btn span{font-size:13px;opacity:.85}
.big-btn:hover{background:var(--fill-2);border-color:var(--fill-2)}
.big-btn:active{transform:translateY(1px)}
.big-btn.alt{background:var(--surface);color:var(--brand);border-color:var(--line-2)}
.big-btn.alt:hover{background:var(--brand-soft)}
.m-minta .big-btn{background:var(--peach);border-color:var(--peach);color:var(--on-peach)}
.m-minta .big-btn:hover{background:var(--peach-2);border-color:var(--peach-2)}
.m-minta .big-btn.alt{background:var(--surface);color:var(--gold);border-color:var(--line-2)}
.m-minta .big-btn.alt:hover{background:var(--gold-soft)}

.module-stat{display:flex;gap:22px;flex-wrap:wrap;padding-top:14px;border-top:1px dashed var(--line-2);font-size:13.5px;color:var(--ink-2)}
.module-stat b{font-size:20px;color:var(--ink);display:block;font-variant-numeric:tabular-nums}
.home-foot{margin-top:26px;font-size:13px;color:var(--muted);text-align:center}

/* Page */
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:800}
.page-head .sub{margin:4px 0 0;color:var(--ink-2)}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card-title{font-size:16px;font-weight:700}
.card-sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card > .card-title{margin-bottom:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input:not([type=checkbox]).fi,.card .filters input,.card .filters select{width:auto;min-width:210px}
.filters .fld input,.filters .fld select{min-width:200px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2.tight{gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* Forms */
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px}
.fld > span{font-weight:600;color:var(--ink-2)}
.fld small{color:var(--muted);font-size:12.5px}
.fld.full{grid-column:1/-1}
.req{color:var(--crit)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],input[type=month],input[type=password],input:not([type]),select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft)}
input[readonly]{background:var(--surface-2);color:var(--ink-2)}
textarea{resize:vertical}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14px;cursor:pointer}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--brand)}

[hidden]{display:none!important}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:16px}
.step{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border:0;border-radius:12px;background:transparent;font-weight:600;color:var(--muted);cursor:pointer}
.step span{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--line);color:var(--ink-2)}
.step.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.step.on span{background:var(--brand-soft);color:var(--brand)}
.sec-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.sec-title svg{color:var(--brand-2);flex:none}
.card-head .sec-title{border:0;padding:0}
.sub-title{font-size:14px;font-weight:700;margin:18px 0 10px}
.pane-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
details.manual{margin-top:14px;padding:12px 14px;border:1px dashed var(--line-2);border-radius:12px;background:var(--surface-2)}
details.manual summary{cursor:pointer;font-weight:600;color:var(--brand-2)}
/* Item grid (peminjaman) */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.item:hover{border-color:var(--brand-2)}
.item.on{border-color:var(--fill-2);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--fill-2)}
.item.off{cursor:not-allowed;opacity:.7;background:var(--surface-2)}
.item.off:hover{border-color:var(--line)}
.item input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand);flex:none}
.item > div{display:flex;flex-direction:column;gap:4px;min-width:0}
.item strong{font-size:15px}
.item small{color:var(--muted);font-size:12.5px}

/* Persediaan rows */
.mlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mrow{display:grid;grid-template-columns:1fr 150px 160px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.mrow:first-child{border-top:0}
.mrow.on{background:var(--gold-soft)}
.mrow.off{opacity:.6}
.mrow strong{display:block}
.mrow small{color:var(--muted);font-size:12.5px}
.mrow .stok{font-size:13.5px;color:var(--ink-2)}
.mrow .stok b{color:var(--ink);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-size:18px;font-weight:700;cursor:pointer}
.stepper button:hover{background:var(--surface-2)}
.stepper input{width:70px;text-align:center;padding:8px 6px}

.action-bar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 -6px 24px rgba(16,32,28,.08)}
.action-bar > div{display:flex;gap:8px}
#selInfo{font-weight:600;color:var(--ink-2)}

/* Loan cards */
.loans{display:flex;flex-direction:column;gap:10px}
.loan{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.loan.late{border-color:color-mix(in srgb,var(--serious) 40%,transparent);background:var(--serious-bg)}
.loan .meta{font-size:13px;color:var(--ink-2);margin-top:4px}
.loan .items{margin-top:6px;font-size:14px}
.loan-side{display:flex;align-items:center;gap:10px;flex:none}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px 3px 7px;border-radius:99px;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral);width:max-content}
.badge i{font-style:normal;width:15px;height:15px;border-radius:99px;display:grid;place-items:center;font-size:10px;line-height:1;background:currentColor}
.badge i::after{content:attr(data-g);color:var(--surface);font-weight:800}
.badge.good{background:var(--good-bg);color:var(--good)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.serious{background:var(--serious-bg);color:var(--serious)}
.badge.crit{background:var(--crit-bg);color:var(--crit)}
.badge.info{background:var(--info-bg);color:var(--info)}

/* Tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:first-child td{border-top:0}
tbody tr:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.act{white-space:nowrap;text-align:right}
td small{display:block;color:var(--muted);font-size:12.5px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:12px;background:var(--surface-2)}
.tbl-note{font-size:12.5px;color:var(--muted);margin-top:8px}

/* KPI + charts */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:left;cursor:pointer;min-width:0}
.kpi:hover{border-color:var(--line-2)}
.kpi-label{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.kpi-val{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink)}
.kpi-sub{font-size:12px;color:var(--muted)}
.kpi.serious{border-color:color-mix(in srgb,var(--serious) 40%,transparent);background:var(--serious-bg)}
.kpi.warn{border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-bg)}
.kpi .badge{padding:1px 4px}
.dash-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chart{width:100%;height:auto;display:block}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .mark{fill:var(--series)}
.chart .val{font-size:12px;font-weight:700;fill:var(--ink)}
.chart .lbl{font-size:12px;fill:var(--muted)}
.chart [data-tip]:hover + .mark, .chart .hit:hover{fill:rgba(127,127,127,.06)}
.barlist{display:flex;flex-direction:column;gap:12px}
.bl-row{display:grid;grid-template-columns:minmax(120px,38%) 1fr 56px;gap:12px;align-items:center;font-size:13.5px}
.bl-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bl-track{height:14px}
.bl-bar{height:14px;background:var(--series);border-radius:0 4px 4px 0}
.bl-val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bl-row:hover .bl-label{color:var(--ink)}
details.tview{margin-top:12px;font-size:13px}
details.tview summary{cursor:pointer;color:var(--muted);font-weight:600}
details.tview table{margin-top:8px}
.cond{display:flex;gap:10px;flex-wrap:wrap}
.cond > div{flex:1;min-width:110px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.cond b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:6px}
#tip{position:fixed;z-index:100;display:none;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;max-width:280px;box-shadow:0 6px 18px rgba(0,0,0,.2)}

/* Modal */
.modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(42,38,64,.35);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;animation:fade .12s}
.modal{width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.modal.wide{width:min(900px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:17px}
.modal-body{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-body p{margin:0}
.modal-body h4{font-size:14px;margin-top:4px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;padding:14px;border-radius:12px;background:var(--surface-2)}
.kv div{font-size:13px;color:var(--muted)}
.kv div b{display:block;color:var(--ink);font-size:14px;font-weight:600}
.ret-list{display:flex;flex-direction:column;gap:8px}
.ret-row{display:grid;grid-template-columns:1fr 180px;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.ret-row small{display:block;color:var(--muted)}
.note{padding:12px 14px;border-radius:10px;background:var(--info-bg);color:var(--info);font-size:13.5px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Toast */
#toasts{position:fixed;right:20px;top:80px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 40px))}
.toast{padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);background:var(--ink);color:var(--surface);animation:fade .15s}
.toast.ok{background:var(--good-bg);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 30%,transparent)}
.toast.err{background:var(--crit-bg);color:var(--crit);border:1px solid color-mix(in srgb,var(--crit) 30%,transparent)}
.toast.warn{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}

/* Success */
.success{max-width:620px;margin:30px auto;text-align:center}
.success .tick{width:84px;height:84px;margin:0 auto 18px;border-radius:99px;background:var(--good-bg);color:var(--good);display:grid;place-items:center}
.success h1{font-size:26px;font-weight:800}
.success .no{display:inline-block;margin:12px 0 18px;padding:6px 14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.success .kv{text-align:left;grid-template-columns:1fr}
.success p.msg{color:var(--ink-2);margin:16px 0 22px}

@media (max-width:1100px){ .kpis{grid-template-columns:repeat(3,1fr)} }
@media (max-width:900px){
  .layout{flex-direction:column}
  .side{width:auto;height:auto;position:static;display:flex;gap:4px;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  .side h5{display:none}
  .nav-btn{width:auto;white-space:nowrap}
  main{padding:20px 16px 120px}
  .modules,.dash-row,.grid2,.grid3,.form-grid{grid-template-columns:1fr}
  .mrow{grid-template-columns:1fr auto}
  .mrow .stok{grid-column:1}
  .topbar{padding:10px 14px}
  .clock{display:none}
}
@media (max-width:560px){ .kpis{grid-template-columns:repeat(2,1fr)} .module-actions{grid-template-columns:1fr} .loan{flex-direction:column;align-items:flex-start} .kv{grid-template-columns:1fr} }
</style>

async function put(path, data, mode = 'set') {
  const ref = S.db.doc(path);
  const op = () => mode === 'update' ? ref.update(data) : ref.set(data);
  try { await op(); } catch (e) { if (e && e.code === 'unavailable') { await sleep(600 + Math.random() * 600); await op(); } else throw e; }
}
async function del(path) { await S.db.doc(path).delete(); }
async function run(fn, okMsg) {
  if (!S.db) { toast('Penyimpanan data tidak tersedia pada tampilan ini.', 'err'); return false; }
  try { await fn(); if (okMsg) toast(okMsg, 'ok'); return true; }
  catch (e) { console.error(e); toast(ERR[e && e.code] || 'Gagal menyimpan data. Silakan coba lagi.', 'err'); return false; }
}

let loadTimer = null, rq = 0;

function onSnap(key, snap, mapper) {
  S[key] = mapper(snap); S.ready[key] = true;
  if (!snap.metadata.fromCache && !S.firstData) { S.firstData = true; clearTimeout(loadTimer); if ($('#banner .warn')) setBanner(''); }

}

async function initDb() {
  loadTimer = setTimeout(() => { if (!S.firstData) setBanner('Data belum dapat dimuat. Periksa koneksi internet; aplikasi akan terus mencoba secara otomatis.', 'warn'); }, 10000);
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { clearTimeout(loadTimer); setBanner('Penyimpanan data tidak tersedia. Buka aplikasi ini melalui akun claude.ai yang memiliki akses, lalu muat ulang halaman.', 'err'); ['aset','persediaan','pegawai','ruang','peminjaman','permintaan','mutasi','settings'].forEach(k => S.ready[k] = true); scheduleRefresh(); return; }
  S.db = db;
  try {
    const user = await window.claude.use('user');
    const can = user && user.can ? await user.can('data.write') : null;
    if (can === false) setBanner('Akun ini hanya dapat melihat data. Perubahan data tidak akan tersimpan.', 'warn');
  } catch (e) { }
  const docs = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  for (const k of ['aset', 'persediaan', 'pegawai', 'ruang', 'peminjaman', 'permintaan', 'mutasi']) {
    db.collection(k).onSnapshot(s => onSnap(k, s, docs), onSnapErr);
  }
  db.doc('pengaturan/umum').onSnapshot(s => onSnap('settings', s, x => x.exists ? { ...x.data() } : {}), onSnapErr);
}

function roundedTop(x, y, w, h, r) { r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function tview(head, rows) { return `<details class="tview"><summary>Tampilkan sebagai tabel</summary>${table(head, rows.map(r => `<tr>${r.map((c, i) => `<td class="${i ? 'num' : ''}">${esc(c)}</td>`).join('')}</tr>`))}</details>`; }
function colChart(data, unit, title) {
  const W = 560, H = 210, pl = 6, pr = 6, pt = 26, pb = 30, ih = H - pt - pb;
  const max = Math.max(1, ...data.map(d => d.value)); const band = (W - pl - pr) / data.length; const bw = Math.min(24, band * .45);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}: ${esc(data.map(d => `${d.label} ${d.value}`).join(', '))}">`;
  [.5, 1].forEach(f => { const y = H - pb - ih * f; s += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/>`; });
  s += `<line class="axis" x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}"/>`;
  data.forEach((d, i) => {
    const h = d.value / max * ih, x = pl + band * i + (band - bw) / 2, y = H - pb - h, cx = pl + band * i + band / 2;
    s += `<rect class="hit" x="${pl + band * i}" y="${pt - 22}" width="${band}" height="${ih + 22}" fill="transparent" data-tip="${esc(d.label)}: ${num(d.value)} ${esc(unit)}"/>`;
    if (h > 0) s += `<path class="mark" d="${roundedTop(x, y, bw, h, 4)}" pointer-events="none"/>`;
    s += `<text class="val" x="${cx}" y="${y - 7}" text-anchor="middle" pointer-events="none">${num(d.value)}</text>`;
    s += `<text class="lbl" x="${cx}" y="${H - 9}" text-anchor="middle" pointer-events="none">${esc(d.label)}</text>`;
  });
  return s + '</svg>' + tview(['Bulan', 'Jumlah'], data.map(d => [d.label, num(d.value)]));
}
function barList(data, unit = '') {
  if (!data.length) return emptyMsg('Belum ada data untuk ditampilkan.');
  const max = Math.max(1, ...data.map(d => d.value));
  return `<div class="barlist">${data.map(d => `<div class="bl-row" data-tip="${esc(d.label)}: ${num(d.value)} ${esc(d.unit || unit)}"><div class="bl-label">${esc(d.label)}</div><div class="bl-track"><div class="bl-bar" style="width:${Math.max(1.5, d.value / max * 100)}%"></div></div><div class="bl-val">${num(d.value)}</div></div>`).join('')}</div>` + tview(['Nama', 'Jumlah'], data.map(d => [d.label, `${num(d.value)} ${d.unit || unit}`]));
}
function kpi(label, value, sub, tone, goTo) { return `<button class="kpi ${tone || ''}" ${goTo ? `data-go="${goTo}"` : ''}><span class="kpi-label">${tone ? `<span class="badge ${tone}"><i aria-hidden="true" data-g="!"></i></span>` : ''}${esc(label)}</span><span class="kpi-val">${num(value)}</span><span class="kpi-sub">${esc(sub || '')}</span></button>`; }
function lastMonths(n) {
  const [y, m] = ym(Date.now()).split('-').map(Number); const out = [];
  for (let i = n - 1; i >= 0; i--) { const d = new Date(Date.UTC(y, m - 1 - i, 15)); out.push({ key: d.toISOString().slice(0, 7), label: d.toLocaleDateString('id-ID', { month: 'short', year: '2-digit', timeZone: 'UTC' }) }); }
  return out;
}

async function saveFile(filename, data) {
  let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) { }
  if (!dl) { toast('Fitur unduh tidak tersedia pada tampilan ini.', 'err'); return; }
  try { await dl.save({ filename, data }); toast('Berkas berhasil diunduh.', 'ok'); }
  catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'rate_limited' ? 'Masih ada proses unduhan yang berjalan. Tunggu sebentar.' : 'Berkas tidak dapat diunduh.', 'err'); }
}
function buildWorkbook(sheets) {
  const wb = XLSX.utils.book_new();
  for (const sh of sheets) {
    const ws = XLSX.utils.aoa_to_sheet(sh.aoa);
    const widths = []; sh.aoa.slice(sh.headerRow || 0).forEach(r => r.forEach((c, i) => { widths[i] = Math.min(45, Math.max(widths[i] || 8, String(c ?? '').length + 2)); }));
    ws['!cols'] = widths.map(w => ({ wch: w }));
    if (sh.merges) ws['!merges'] = sh.merges;
    XLSX.utils.book_append_sheet(wb, ws, sh.name.slice(0, 31));
  }
  return XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
}
function reportAoa(judul, periode, head, rows) {
  const c = cfg(); const n = head.length;
  const aoa = [[c.namaSekolah.toUpperCase()], [judul.toUpperCase()], [periode], [], head, ...rows, [], []];
  const right = Math.max(n - 2, 1);
  const line = (l, r) => { const a = new Array(n).fill(''); a[0] = l; a[right] = r; return a; };
  aoa.push(line('Mengetahui,', `${c.kota || 'Jakarta'}, ${fmtTglPanjang(Date.now())}`));
  aoa.push(line('Kepala Sekolah', 'Pengurus Barang'));
  aoa.push([], [], []);
  aoa.push(line(c.kepalaSekolah || '(.................................)', c.pengurusBarang || '(.................................)'));
  aoa.push(line(c.nipKepala ? 'NIP. ' + c.nipKepala : 'NIP.', c.nipPengurus ? 'NIP. ' + c.nipPengurus : 'NIP.'));
  return aoa;
}

const normH = s => String(s).toLowerCase().replace(/\*/g, '').replace(/\(.*?\)/g, '').replace(/[^a-z0-9]/g, '');
function importExcel(kind) {
  const sp = IMPORT[kind];
  const m = modal({ title: `Impor ${sp.judul} dari Excel`, wide: true, body: `<div class="note">Gunakan templat agar nama kolom sesuai. Kolom bertanda * wajib diisi. Baris pertama berisi judul kolom. Hapus baris contoh sebelum mengimpor.</div><div><button type="button" class="link" data-tpl>Unduh templat ${esc(sp.judul)}</button></div><label class="fld full"><span>Pilih berkas Excel (.xlsx)</span><input type="file" accept=".xlsx,.xls,.csv" data-file></label><div data-prev></div>`, foot: `<button type="button" class="btn ghost" data-close>Tutup</button><button type="button" class="btn primary" data-go-imp disabled>Impor Data</button>` });
  let ready = [];
  m.el.querySelector('[data-tpl]').onclick = () => downloadTemplate(kind);
  m.el.querySelector('[data-file]').onchange = async e => {
    const file = e.target.files[0]; if (!file || !xlsxReady()) return;
    const prev = m.el.querySelector('[data-prev]'); const btn = m.el.querySelector('[data-go-imp]');
    try {
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false });
      const hi = rows.findIndex(r => r.some(c => normH(c) === normH(sp.cols.find(x => x[2])[1])));
      if (hi < 0) { prev.innerHTML = `<div class="note warn">Kolom "${esc(sp.cols.find(x => x[2])[1])}" tidak ditemukan. Pastikan berkas mengikuti templat.</div>`; btn.disabled = true; return; }
      const hdr = rows[hi].map(normH); const idx = sp.cols.map(([k, l]) => { let i = hdr.indexOf(normH(l)); if (i < 0 && k === 'merk') i = hdr.indexOf('merktipe'); return i; });
      const missing = sp.cols.filter((c, i) => c[2] && idx[i] < 0).map(c => c[1]);
      if (missing.length) { prev.innerHTML = `<div class="note warn">Kolom wajib tidak ditemukan: ${esc(missing.join(', '))}.</div>`; btn.disabled = true; return; }
      const data = rows.slice(hi + 1).map(r => { const o = {}; sp.cols.forEach(([k], i) => { if (idx[i] >= 0) o[k] = String(r[idx[i]] ?? '').trim(); }); return o; }).filter(o => o.nama && !/^\(.*\)$/.test(o.nama));
      const skipped = []; ready = [];
      const exist = kind === 'aset' ? new Set(S.aset.filter(a => a.kode || a.nup).map(a => `${a.kode}|${a.nup}`.toLowerCase())) : kind === 'persediaan' ? new Set(S.persediaan.map(p => (p.kode || p.nama).toLowerCase())) : new Set(S.pegawai.map(p => (p.nip || p.nama).toLowerCase()));
      for (const o of data) {
        if (/^\(.*\)$/.test(o.kode || '')) o.kode = '';
        if (/^\(.*\)$/.test(o.nip || '')) o.nip = '';
        let key = kind === 'aset' ? ((o.kode || o.nup) ? `${o.kode || ''}|${o.nup || ''}`.toLowerCase() : null) : kind === 'persediaan' ? (o.kode || o.nama).toLowerCase() : (o.nip || o.nama).toLowerCase();
        if (kind === 'persediaan' && !o.satuan) { skipped.push(`${o.nama}: satuan kosong`); continue; }
        if (key && exist.has(key)) { skipped.push(`${o.nama}: sudah terdaftar`); continue; }
        if (kind === 'aset') { o.kondisi = KONDISI.find(k => k.toLowerCase() === (o.kondisi || '').toLowerCase()) || 'Baik'; }
        if (key) exist.add(key);
        ready.push(o);
      }
      const show = ready.slice(0, 8);
      prev.innerHTML = `<p><b>${ready.length}</b> baris siap diimpor${skipped.length ? `, <b>${skipped.length}</b> baris dilewati` : ''}.</p>` +
        (show.length ? table(sp.cols.map(c => c[1]), show.map(o => `<tr>${sp.cols.map(([k]) => `<td>${esc(o[k] || '')}</td>`).join('')}</tr>`)) + (ready.length > show.length ? `<p class="tbl-note">Menampilkan 8 baris pertama.</p>` : '') : '') +
        (skipped.length ? `<details class="tview"><summary>Lihat baris yang dilewati</summary><ul class="small">${skipped.slice(0, 100).map(s => `<li>${esc(s)}</li>`).join('')}</ul></details>` : '');
      btn.disabled = !ready.length; btn.textContent = `Impor ${ready.length} Data`;
    } catch (err) { console.error(err); prev.innerHTML = `<div class="note warn">Berkas tidak dapat dibaca. Pastikan formatnya .xlsx.</div>`; btn.disabled = true; }
  };
  m.el.querySelector('[data-go-imp]').onclick = async e => {
    const btn = e.target; btn.disabled = true; let done = 0;
    const ok = await run(async () => {
      for (const o of ready) {
        const id = uid(); const now = Date.now();
        if (kind === 'aset') await put('aset/' + id, { kode: o.kode || '', nup: o.nup || '', nama: o.nama, merk: o.merk || '', kategori: o.kategori || '', tahun: o.tahun || '', lokasi: o.lokasi || '', kondisi: o.kondisi, status: o.kondisi === 'Baik' ? 'tersedia' : 'perbaikan', ket: o.ket || '', tsDibuat: now });
        else if (kind === 'persediaan') { const stok = Math.max(0, toInt(o.stok)); await put('persediaan/' + id, { kode: o.kode || '', nama: o.nama, kategori: o.kategori || '', satuan: o.satuan, stok, stokMin: Math.max(0, toInt(o.stokMin)), tsDibuat: now }); if (stok > 0) await addMutasi({ persediaanId: id, kode: o.kode || '', nama: o.nama, satuan: o.satuan, ts: now, jenis: 'saldo_awal', jumlah: stok, saldo: stok, ref: 'Impor', ket: 'Saldo awal dari impor Excel' }); }
        else await put('pegawai/' + id, { nama: o.nama, nip: o.nip || '', jabatan: o.jabatan || '', tsDibuat: now });
        done++; btn.textContent = `Mengimpor… ${done}/${ready.length}`;
        if (done % 20 === 0) await sleep(1200);
      }
    });
    if (ok) { toast(`${done} data berhasil diimpor.`, 'ok'); m.close(); } else { btn.disabled = false; btn.textContent = `Lanjutkan Impor`; ready = ready.slice(done); toast(`${done} data sudah tersimpan sebelum terjadi kendala.`, 'warn'); }
  };
}

function openReturn(id, after) {
  const l = S.peminjaman.find(x => x.id === id);

  const m = modal({ title: 'Konfirmasi Pengembalian', body: `<form id="fRet" novalidate class="stack" style="gap:14px"><div class="kv">${kv('Nomor', l.no)}${kv('Peminjam', l.peminjam)}${kv('Waktu pinjam', fmtWaktu(l.tsPinjam))}${kv('Rencana kembali', fmtWaktu(l.tsRencana))}</div>${isLate(l) ? `<div class="note warn">Pengembalian ini melewati rencana waktu pengembalian.</div>` : ''}<h4>Kondisi barang saat dikembalikan</h4><div class="ret-list">${(l.items || []).map((it, i) => `<div class="ret-row"><div><strong>${esc(it.nama)}</strong><small>${esc([it.merk, (Number(it.jumlah) || 1) > 1 && num(it.jumlah) + ' buah', it.kode, it.nup && 'Reg. ' + it.nup].filter(Boolean).join(' · '))}</small></div><select name="k${i}" aria-label="Kondisi ${esc(it.nama)}">${KONDISI.map(k => `<option>${k}</option>`).join('')}</select></div>`).join('')}</div><label class="fld full"><span>Catatan (opsional)</span><textarea name="cat" rows="2" maxlength="300" placeholder="Contoh: Kabel HDMI belum dikembalikan"></textarea></label><p class="small muted">Barang dengan kondisi rusak akan ditandai "Perlu Perbaikan" dan tidak dapat dipinjam sampai statusnya diperbarui admin.</p></form>`, foot: `<button type="button" class="btn ghost" data-close>Batal</button><button type="button" class="btn primary" data-ok>Konfirmasi Pengembalian</button>` });
  m.el.querySelector('[data-ok]').onclick = async e => {

      const now = Date.now();
      await put('peminjaman/' + l.id, { status: 'dikembalikan', tsKembali: now, items, catatanKembali: cat }, 'update');
      for (const it of items) {
        const a = S.aset.find(x => x.id === it.id);
        if (it.id && a) await put('aset/' + it.id, { status: it.kondisi === 'Baik' ? 'tersedia' : 'perbaikan', kondisi: it.kondisi, pinjamId: '', peminjam: '' }, 'update');
      }
    });

    if (ok) { m.close(); after && after(l, items); }

}
async function processRequest(req, approved, catatan = '') {
  const now = Date.now(); const items = [];
  for (const it of req.items || []) {
    const p = S.persediaan.find(x => x.id === it.id);
    let j = Math.max(0, toInt(approved[it.id] ?? it.jumlah));
    if (!p) { items.push({ ...it, diserahkan: 0 }); continue; }
    j = Math.min(j, Number(p.stok) || 0);
    if (j > 0) {
      const saldo = (Number(p.stok) || 0) - j;
      await put('persediaan/' + p.id, { stok: saldo }, 'update');
      await addMutasi({ persediaanId: p.id, kode: p.kode || '', nama: p.nama, satuan: p.satuan || '', ts: now, jenis: 'keluar', jumlah: j, saldo, ref: req.no, ket: `Permintaan ${req.pemohon}` });
      p.stok = saldo;
    }
    items.push({ ...it, diserahkan: j });
  }
  await put('permintaan/' + req.id, { status: 'diserahkan', items, tsProses: now, catatanAdmin: catatan }, 'update');
}
function openProcess(id) {
  const r = S.permintaan.find(x => x.id === id);
  if (!r || r.status !== 'menunggu') { toast('Permintaan tidak ditemukan atau sudah diproses.', 'err'); return; }
  const rows = (r.items || []).map(it => { const p = S.persediaan.find(x => x.id === it.id); const stok = p ? Number(p.stok) || 0 : 0; const def = Math.min(it.jumlah, stok); return `<tr><td><strong>${esc(it.nama)}</strong><small>${esc(it.kode || '')}</small></td><td class="num">${num(it.jumlah)} ${esc(it.satuan)}</td><td class="num">${p ? num(stok) + ' ' + esc(p.satuan || '') : '<span class="muted">Barang terhapus</span>'}</td><td><input type="number" min="0" max="${stok}" value="${def}" data-ap="${esc(it.id)}" style="width:100px" ${p ? '' : 'disabled'} inputmode="numeric"></td></tr>`; });
  const m = modal({ title: 'Proses Permintaan Persediaan', wide: true, body: `<div class="kv">${kv('Nomor', r.no)}${kv('Tanggal', fmtWaktu(r.ts))}${kv('Pemohon', r.pemohon + (r.nip ? ' — ' + r.nip : ''))}${kv('Keperluan', r.keperluan)}</div>${table(['Barang', { t: 'Diminta', c: 'num' }, { t: 'Stok saat ini', c: 'num' }, 'Jumlah yang diserahkan'], rows)}<label class="fld full"><span>Catatan admin (opsional)</span><textarea data-cat rows="2" maxlength="300" placeholder="Contoh: Stok kertas A4 terbatas sehingga diserahkan sebagian"></textarea></label><p class="small muted">Jumlah yang diserahkan tidak boleh melebihi stok. Stok akan berkurang otomatis dan tercatat pada kartu persediaan.</p>`, foot: `<button type="button" class="btn ghost" data-close>Batal</button><button type="button" class="btn outline" data-tolak style="color:var(--crit)">Tolak Permintaan</button><button type="button" class="btn primary" data-ok>Setujui dan Serahkan</button>` });
  m.el.querySelector('[data-ok]').onclick = async e => {
    const ap = {}; let bad = false;
    $$('[data-ap]', m.el).forEach(i => { const v = toInt(i.value); if (v < 0 || v > Number(i.max)) bad = true; ap[i.dataset.ap] = v; });
    if (bad) { toast('Periksa kembali jumlah yang diserahkan. Jumlah tersebut tidak boleh melebihi stok.', 'err'); return; }
    if (!Object.values(ap).some(v => v > 0)) { toast('Isi jumlah yang diserahkan untuk minimal satu barang, atau pilih Tolak Permintaan.', 'err'); return; }
    btnBusy(e.target, true);
    const ok = await run(() => processRequest(r, ap, $('[data-cat]', m.el).value.trim()), 'Permintaan disetujui dan stok diperbarui.');
    btnBusy(e.target, false); if (ok) m.close();
  };
  m.el.querySelector('[data-tolak]').onclick = async e => {
    const cat = $('[data-cat]', m.el).value.trim();
    if (!cat) { toast('Tuliskan alasan penolakan pada kolom catatan admin.', 'err'); $('[data-cat]', m.el).focus(); return; }
    btnBusy(e.target, true, 'Memproses…');
    const ok = await run(() => put('permintaan/' + r.id, { status: 'ditolak', tsProses: Date.now(), catatanAdmin: cat }, 'update'), 'Permintaan ditolak.');
    btnBusy(e.target, false); if (ok) m.close();
  };
}

const LAPORAN = {
  peminjaman: { judul: 'Laporan Peminjaman Barang', head: ['No. Transaksi', 'Tanggal Pinjam', 'Nama Peminjam', 'NIP', 'Jabatan/Peran', 'Kelas/Unit Kerja', 'Guru Penanggung Jawab', 'Mata Pelajaran/Ekstrakurikuler', 'Tujuan Peminjaman', 'Nama Barang', 'Merek/Tipe', 'Jumlah', 'Kode Barang/No. Inventaris', 'Lokasi Pemakaian', 'Rencana Kembali', 'Tanggal Kembali', 'Kondisi Kembali', 'Status'],
    rows: (f, t) => S.peminjaman.filter(l => l.tsPinjam >= f && l.tsPinjam <= t).sort((a, b) => a.tsPinjam - b.tsPinjam).flatMap(l => (l.items || []).map(i => [l.no, fmtWaktu(l.tsPinjam), l.peminjam, l.nip || '', l.peran || l.jabatan || '', l.unitKerja || '', l.penanggungJawab || '', l.mapel || '', l.keperluan || '', i.nama, i.merk || '', Number(i.jumlah) || 1, [i.kode, i.nup && 'Reg. ' + i.nup].filter(Boolean).join(' '), l.lokasi || '', fmtWaktu(l.tsRencana), l.tsKembali ? fmtWaktu(l.tsKembali) : '', i.kondisi || '', BADGE[loanStatus(l)][1]])) },
  permintaan: { judul: 'Laporan Permintaan Barang Persediaan', head: ['No. Permintaan', 'Tanggal', 'Pemohon', 'NIP', 'Keperluan', 'Kode Barang', 'Nama Barang', 'Satuan', 'Diminta', 'Diserahkan', 'Status', 'Catatan'],
    rows: (f, t) => S.permintaan.filter(r => r.ts >= f && r.ts <= t).sort((a, b) => a.ts - b.ts).flatMap(r => (r.items || []).map(i => [r.no, fmtWaktu(r.ts), r.pemohon, r.nip || '', r.keperluan || '', i.kode || '', i.nama, i.satuan || '', Number(i.jumlah) || 0, i.diserahkan != null ? Number(i.diserahkan) : '', (BADGE[r.status] || [, r.status])[1], r.catatanAdmin || ''])) },
  mutasi: { judul: 'Laporan Mutasi Barang Persediaan', head: ['Tanggal', 'Kode Barang', 'Nama Barang', 'Satuan', 'Uraian', 'Masuk', 'Keluar', 'Saldo', 'Referensi', 'Keterangan'],
    rows: (f, t) => S.mutasi.filter(m => m.ts >= f && m.ts <= t).sort((a, b) => a.ts - b.ts).map(m => { const q = Number(m.jumlah) || 0; const inQ = m.jenis === 'masuk' || m.jenis === 'saldo_awal' || (m.jenis === 'penyesuaian' && q > 0); return [fmtWaktu(m.ts), m.kode || '', m.nama, m.satuan || '', JENIS_MUTASI[m.jenis] || m.jenis, inQ ? Math.abs(q) : '', inQ ? '' : Math.abs(q), Number(m.saldo) || 0, m.ref || '', m.ket || '']; }) },
  rekap: { judul: 'Rekapitulasi Barang Persediaan', head: ['Kode Barang', 'Nama Barang', 'Satuan', 'Saldo Awal', 'Masuk', 'Keluar', 'Penyesuaian', 'Saldo Akhir'],
    rows: (f, t) => [...S.persediaan].sort(byName).map(p => { const ms = S.mutasi.filter(m => m.persediaanId === p.id).sort((a, b) => a.ts - b.ts); const before = ms.filter(m => m.ts < f); const awal = before.length ? Number(before[before.length - 1].saldo) || 0 : 0; const ins = ms.filter(m => m.ts >= f && m.ts <= t); const masuk = sum(ins.filter(m => m.jenis === 'masuk' || m.jenis === 'saldo_awal'), 'jumlah'); const kel = sum(ins.filter(m => m.jenis === 'keluar'), 'jumlah'); const pen = sum(ins.filter(m => m.jenis === 'penyesuaian'), 'jumlah'); return [p.kode || '', p.nama, p.satuan || '', awal, masuk, kel, pen, awal + masuk - kel + pen]; }) },
  aset: { judul: 'Daftar Aset yang Dapat Dipinjam', noPeriode: true, head: ['Kode Barang', 'NUP/No. Register', 'Nama Barang', 'Merek/Tipe', 'Kategori', 'Tahun Perolehan', 'Lokasi', 'Kondisi', 'Status', 'Keterangan'],
    rows: () => [...S.aset].sort(byName).map(a => [a.kode || '', a.nup || '', a.nama, a.merk || '', a.kategori || '', a.tahun || '', a.lokasi || '', a.kondisi || 'Baik', BADGE[a.status || 'tersedia'][1], a.ket || '']) }
};
V['a-laporan'] = {
  mount(el) {
    const now = Date.now(), awal = ym(now) + '-01', today = ymd(now);
    el.innerHTML = adminHead('Laporan', 'Pratinjau dan unduh laporan dalam format Excel') + `<div class="card" style="margin-bottom:16px"><form id="fLap" class="filters" novalidate><label class="fld"><span>Jenis laporan</span><select name="jenis"><option value="peminjaman">Peminjaman Barang</option><option value="permintaan">Permintaan Barang Persediaan</option><option value="mutasi">Mutasi Barang Persediaan</option><option value="rekap">Rekapitulasi Persediaan</option><option value="aset">Daftar Aset</option></select></label><label class="fld"><span>Dari tanggal</span><input type="date" name="dari" value="${awal}"></label><label class="fld"><span>Sampai tanggal</span><input type="date" name="sampai" value="${today}"></label><div style="display:flex;gap:8px;align-self:flex-end"><button class="btn" type="button" data-x>Unduh Excel</button></div></form></div><div class="card"><div class="card-head"><div><h2 class="card-title" id="lapJudul"></h2><p class="card-sub" id="lapPer"></p></div><span class="small muted" id="cnt"></span></div><div id="tbl"></div></div>`;
    const f = $('#fLap');
    f.addEventListener('change', () => this.refresh());
    el.querySelector('[data-x]').onclick = () => this.unduh();
    this.refresh();
  },
  get() {
    const f = $('#fLap'); if (!f) return null; const L = LAPORAN[f.jenis.value];
    let from = tsFromLocal(f.dari.value || '2000-01-01'), to = tsFromLocal(f.sampai.value || ymd(Date.now()), '23:59') + 59999;
    if (from > to) [from, to] = [to - 86399999, from + 86399999];
    $$('[name=dari],[name=sampai]', f).forEach(i => i.disabled = !!L.noPeriode);
    return { L, from, to, rows: L.rows(from, to), periode: L.noPeriode ? `Keadaan per ${fmtTglPanjang(Date.now())}` : `Periode ${fmtTglPanjang(from)} s.d. ${fmtTglPanjang(to)}` };
  },
  refresh() {
    const r = this.get(); if (!r) return;
    $('#lapJudul').textContent = r.L.judul; $('#lapPer').textContent = r.periode; $('#cnt').textContent = `${num(r.rows.length)} baris`;
    const numCols = new Set(r.L.head.map((h, i) => ['Jumlah', 'Diminta', 'Diserahkan', 'Masuk', 'Keluar', 'Saldo', 'Saldo Awal', 'Penyesuaian', 'Saldo Akhir'].includes(h) ? i : -1));
    const shown = r.rows.slice(0, 200);
    $('#tbl').innerHTML = table(r.L.head.map((h, i) => numCols.has(i) ? { t: h, c: 'num' } : h), shown.map(row => `<tr>${row.map((c, i) => `<td class="${numCols.has(i) ? 'num' : ''}">${esc(typeof c === 'number' ? num(c) : c)}</td>`).join('')}</tr>`), 'Tidak ada data pada periode ini.') + (r.rows.length > shown.length ? `<p class="tbl-note">Pratinjau menampilkan 200 baris pertama. Berkas Excel memuat seluruh ${num(r.rows.length)} baris.</p>` : '');
  },
  unduh() {
    if (!xlsxReady()) return; const r = this.get(); if (!r) return;
    if (!r.rows.length) { toast('Tidak ada data untuk diunduh pada periode ini.', 'err'); return; }
    const f = $('#fLap'); const suffix = r.L.noPeriode ? ymd(Date.now()) : `${f.dari.value} s.d. ${f.sampai.value}`;
    saveFile(`${r.L.judul} ${suffix}.xlsx`, buildWorkbook([{ name: r.L.judul.replace('Laporan ', ''), headerRow: 4, aoa: reportAoa(r.L.judul, r.periode, r.L.head, r.rows) }]));
  }
};

/* ---- ADMIN: Pengaturan ---- */
V['a-pengaturan'] = {
  mount(el) {
    this.drawn = !!S.ready.settings;
    el.innerHTML = adminHead('Pengaturan', 'Identitas sekolah, penandatangan laporan, dan keamanan') + `<div class="stack"><form class="card" id="fSet" novalidate><h2 class="card-title">Identitas dan Alur Kerja</h2><div class="form-grid" id="setFields"></div><div style="margin-top:16px;display:flex;justify-content:flex-end"><button class="btn primary" type="submit">Simpan Pengaturan</button></div></form>
    <form class="card" id="fPinNew" novalidate><h2 class="card-title">Ganti PIN Admin</h2><div class="form-grid"><label class="fld"><span>PIN lama</span><input type="password" name="lama" inputmode="numeric" maxlength="12" autocomplete="off"></label><span></span><label class="fld"><span>PIN baru (4–12 digit)</span><input type="password" name="baru" inputmode="numeric" maxlength="12" autocomplete="off"></label><label class="fld"><span>Ulangi PIN baru</span><input type="password" name="ulang" inputmode="numeric" maxlength="12" autocomplete="off"></label></div><p class="small muted" style="margin:12px 0 0">PIN mencegah pengguna komputer layanan membuka menu admin. PIN bukan pengaman data karena akses data tetap ditentukan oleh akun claude.ai pemilik aplikasi.</p><div style="margin-top:16px;display:flex;justify-content:flex-end"><button class="btn primary" type="submit">Ganti PIN</button></div></form></div>`;
    this.draw();
    $('#fSet').addEventListener('submit', async e => {
      e.preventDefault(); const f = e.target; const v = {};
      ['namaSekolah', 'kota', 'jamKembali', 'kepalaSekolah', 'nipKepala', 'pengurusBarang', 'nipPengurus'].forEach(k => v[k] = f.elements[k].value.trim());
      v.perluPersetujuan = f.elements.perluPersetujuan.value === 'ya';
      if (!v.namaSekolah) { toast('Nama sekolah wajib diisi.', 'err'); return; }
      const b = f.querySelector('[type=submit]'); btnBusy(b, true);
      await run(() => put('pengaturan/umum', { ...S.settings, ...v }), 'Pengaturan disimpan.'); btnBusy(b, false);
    });
    $('#fPinNew').addEventListener('submit', async e => {
      e.preventDefault(); const f = e.target;
      if (f.lama.value !== String(cfg().pin)) { toast('PIN lama tidak sesuai.', 'err'); return; }
      if (!/^\d{4,12}$/.test(f.baru.value)) { toast('PIN baru harus 4–12 digit angka.', 'err'); return; }
      if (f.baru.value !== f.ulang.value) { toast('Pengulangan PIN baru tidak sama.', 'err'); return; }
      if (await run(() => put('pengaturan/umum', { ...cfg(), ...S.settings, pin: f.baru.value }), 'PIN admin berhasil diganti.')) f.reset();
    });
  },
  draw() {
    const c = cfg(); const box = $('#setFields'); if (!box) return;
    box.innerHTML = [
      { name: 'namaSekolah', label: 'Nama Sekolah', value: c.namaSekolah, required: true, maxlength: 100 },
      { name: 'kota', label: 'Kota (untuk tanda tangan laporan)', value: c.kota, maxlength: 40 },
      { name: 'perluPersetujuan', label: 'Permintaan persediaan perlu persetujuan admin?', type: 'select', options: [['ya', 'Ya — stok berkurang setelah disetujui'], ['tidak', 'Tidak — stok langsung berkurang saat diinput']], value: c.perluPersetujuan ? 'ya' : 'tidak' },
      { name: 'jamKembali', label: 'Jam pengembalian bawaan', type: 'time', value: c.jamKembali },
      { name: 'kepalaSekolah', label: 'Nama Kepala Sekolah', value: c.kepalaSekolah, maxlength: 120 },
      { name: 'nipKepala', label: 'NIP Kepala Sekolah', value: c.nipKepala, maxlength: 25, inputmode: 'numeric' },
      { name: 'pengurusBarang', label: 'Nama Pengurus Barang', value: c.pengurusBarang, maxlength: 120 },
      { name: 'nipPengurus', label: 'NIP Pengurus Barang', value: c.nipPengurus, maxlength: 25, inputmode: 'numeric' }
    ].map(fieldHTML).join('');
  },
  refresh() { if (!this.drawn && S.ready.settings) { this.drawn = true; this.draw(); } }
};

/* ============ Mulai ============ */
renderHeader();
go('home');
initDb();
</script>
